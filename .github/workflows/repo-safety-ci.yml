name: Repo Safety & CI

on:
  push:
  pull_request:

jobs:
  safety-checks:
    name: Safety Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if Maven wrapper checksum placeholders exist
        run: |
          if grep -R -n "REPLACE_WITH_OFFICIAL_SHA256" .; then
            echo "ERROR: Found distributionSha256Sum placeholders. Replace them with the official SHA-256.";
            exit 1;
          else
            echo "No wrapper checksum placeholders found.";
          fi

      - name: Fail if DTOs expose password fields
        run: |
          if grep -R -n --include="*.java" "private String password;" .; then
            echo "ERROR: Found 'private String password;' in Java sources. Remove sensitive fields from DTOs.";
            grep -R -n --include="*.java" "private String password;" . || true;
            exit 1;
          else
            echo "No DTO password fields found.";
          fi

      - name: Fail on literal secret keys in YAML
        run: |
          bad=0
          for key in "gemini.api.key" "spring.datasource.password" "SPRING_DATASOURCE_PASSWORD" "GEMINI_API_KEY"; do
            # show lines that contain the key and do not contain a ${ placeholder
            matches=$(grep -R --line-number --include="*.yml" "$key" . || true)
            if [ -n "$matches" ]; then
              echo "$matches" | while read -r line; do
                if ! echo "$line" | grep -q "\$\{"; then
                  echo "Literal secret key found: $line";
                  bad=1
                fi
              done
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "ERROR: Found literal secret values in YAML (see above). Use env-backed placeholders or secrets manager.";
            exit 1
          else
            echo "No literal secret values found for monitored keys.";
          fi

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: safety-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build and run tests
        run: mvn -B -T1C -DskipTests=false verify
